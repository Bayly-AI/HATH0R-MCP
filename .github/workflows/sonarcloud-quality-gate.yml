# PR Quality Gates — SonarCloud hard stop (canonical thresholds only)
# Policy: SonarCloud Quality Gate is the ONLY threshold source. Do NOT add
# local coverage/rating minimums in sonar-project.properties that diverge
# from the org SonarCloud Quality Gate. Failed gate = hard stop (merge blocked).
name: SonarCloud Quality Gate

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development, testing, staging, master]
  push:
    branches: [development]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: sonar-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud-quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN secret is not configured on this repository."
            echo "Add a SonarCloud token (secret SONAR_TOKEN) and optional vars.SONAR_ORGANIZATION."
            echo "See docs/governance/playbooks/sonarcloud-quality-gate-playbook.md"
            exit 1
          fi
          echo "SONAR_TOKEN present (value not logged)."

      - name: Resolve Sonar organization and project key
        id: meta
        env:
          VARS_ORG: ${{ vars.SONAR_ORGANIZATION }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${VARS_ORG:-bayly-ai}"
          REPO_NAME="${REPO#*/}"
          PROJECT_KEY="Bayly-AI_${REPO_NAME}"

          if [ -f "sonar-project.properties" ]; then
            if grep -Eq '^sonar\.organization=' sonar-project.properties; then
              ORG=$(grep '^sonar\.organization=' sonar-project.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            fi
            if grep -Eq '^sonar\.projectKey=' sonar-project.properties; then
              PROJECT_KEY=$(grep '^sonar\.projectKey=' sonar-project.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            fi
          fi

          echo "organization=${ORG}" >> "$GITHUB_OUTPUT"
          echo "projectKey=${PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          echo "Resolved Sonar org: ${ORG}, projectKey: ${PROJECT_KEY}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate coverage report
        env:
          KB_TEST_MODE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .
          pytest --cov=src --cov-report=xml:coverage.xml || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ steps.meta.outputs.organization }}
            -Dsonar.projectKey=${{ steps.meta.outputs.projectKey }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
