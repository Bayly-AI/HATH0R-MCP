name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout MCP
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .
          pip install git+https://github.com/Bayly-AI/HATH0R-CLI.git@development
          pip install mypy ruff

      - name: Pytest with Coverage
        env:
          KB_TEST_MODE: "1"
        run: python -m pytest -v --tb=short

      - name: Lint
        run: ruff check src/ tests/

      - name: Bootstrap smoke validation
        run: ./bin/hath0r-bootstrap.sh
